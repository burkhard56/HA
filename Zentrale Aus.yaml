alias: Zentrale AUS (Label)
description: >
  Vorschau + optionales Ausschalten aller eingeschalteten Switches/Lights,
  die das Label "Zentral Aus" tragen. Schalten nur, wenn input_boolean.zentrale_aus = on.
mode: single

sequence:

  # 1️⃣ Vorschau anzeigen (ohne zu schalten)
  - service: persistent_notification.create
    data:
      title: "Zentrale AUS – Vorschau"
      message: >-
        {% set ents = label_entities('Zentral Aus') %}
        {% set ns = namespace(list=[]) %}

        Eingeschaltete Switches/Lichter mit Label **Zentral Aus**:

        {% for eid in ents
              if (eid.startswith('switch.') or eid.startswith('light.'))
              and states(eid) == 'on' %}
        - {{ state_attr(eid, 'friendly_name') or eid }} = {{ states(eid) }}
        {% set ns.list = ns.list + [eid] %}
        {% endfor %}

        {% if ns.list | length == 0 %}
        (Nichts zu schalten.)
        {% endif %}

  # 2️⃣ Nur schalten, wenn Freigabe aktiv ist
  - choose:
      - conditions:
          - condition: state
            entity_id: input_boolean.zentral_aus
            state: "on"
        sequence:

          # Alle passenden Entitäten sammeln und ausschalten
          - repeat:
              for_each: >-
                {% set ents = label_entities('Zentral Aus') %}
                {% set ns = namespace(list=[]) %}
                {% for e in ents %}
                  {% if (e.startswith('switch.') or e.startswith('light.')) and states(e) == 'on' %}
                    {% set ns.list = ns.list + [e] %}
                  {% endif %}
                {% endfor %}
                {{ ns.list }}

              sequence:
                - service: homeassistant.turn_off
                  target:
                    entity_id: "{{ repeat.item }}"

          # Optionale Rückmeldung
          - service: persistent_notification.create
            data:
              title: "Zentrale AUS – ausgeführt"
              message: "Alle markierten Geräte wurden ausgeschaltet."
    default: []

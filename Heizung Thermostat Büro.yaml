alias: Heizung Thermostat Büro
description: |-
  05.01.2025
  Heizung steht auf Ein
  - Zwischen 21:00 und 07:00 wird die Temperatur auf 12 gestellt
  - Wenn das Fenster geöffnet ist wird die Temperatur auf 12 gestellt
  - wird Temp auf 22 gestellt, und Ventilator eingeschaltet
triggers:
  - entity_id: binary_sensor.bthome_sensor_b152_window
    trigger: state
  - at: "21:00:00"
    trigger: time
  - at: "07:00:00"
    trigger: time
  - trigger: time_pattern
    minutes: /10
conditions:
  - condition: state
    state:
      - "on"
    entity_id: switch.heizung
actions:
  - choose:
      - conditions:
          - condition: state
            entity_id: binary_sensor.bthome_sensor_b152_window
            state: Geöffnet
        sequence:
          - target:
              entity_id: climate.blutrvbuero
            data:
              temperature: 12
            action: climate.set_temperature
          - action: switch.turn_off
            metadata: {}
            data: {}
            target:
              entity_id: switch.hm_st15
      - conditions:
          - condition: time
            after: "21:00:00"
            before: "07:00:00"
          - condition: state
            entity_id: climate.heizung_leaving_water_offset
            state:
              - heat
        sequence:
          - target:
              entity_id: climate.blutrvbuero
            data:
              temperature: 12
            action: climate.set_temperature
          - action: switch.turn_off
            metadata: {}
            data: {}
            target:
              entity_id: switch.hm_st15
    default:
      - target:
          entity_id: climate.blutrvbuero
        data:
          temperature: 22
        action: climate.set_temperature
      - action: switch.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: switch.hm_st15
mode: single

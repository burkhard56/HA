alias: Heizung Thermostat Büro
description: >
  Heizung steht auf Ein:
  - Nachts (21:00–07:00): Temperatur immer auf 12°, Ventilator aus
  - Tagsüber (07:00–21:00):
    - Fenster geöffnet: Temperatur auf 12°, Ventilator aus
    - Fenster geschlossen: Temperatur auf 22°, Ventilator an
trigger:
  - platform: state
    entity_id: binary_sensor.bthome_sensor_b152_window
  - platform: time
    at: "21:00:00"
  - platform: time
    at: "07:00:00"
condition:
  - condition: state
    entity_id: switch.heizung
    state: "on"
action:
  - choose:
      # Nachts (21:00–07:00): Immer 12°, Ventilator aus
      - conditions:
          - condition: time
            after: "21:00:00"
            before: "07:00:00"
        sequence:
          - service: climate.set_temperature
            target:
              entity_id: climate.blutrvbuero
            data:
              temperature: 12
          - service: switch.turn_off
            target:
              entity_id: switch.hm_st15
      # Tagsüber (07:00–21:00) UND Fenster geöffnet
      - conditions:
          - condition: time
            after: "07:00:00"
            before: "21:00:00"
          - condition: state
            entity_id: binary_sensor.bthome_sensor_b152_window
            state: "on"  # oder "Geöffnet"
        sequence:
          - service: climate.set_temperature
            target:
              entity_id: climate.blutrvbuero
            data:
              temperature: 12
          - service: switch.turn_off
            target:
              entity_id: switch.hm_st15
      # Tagsüber (07:00–21:00) UND Fenster geschlossen
      - conditions:
          - condition: time
            after: "07:00:00"
            before: "21:00:00"
          - condition: state
            entity_id: binary_sensor.bthome_sensor_b152_window
            state: "off"  # oder "Geschlossen"
        sequence:
          - service: climate.set_temperature
            target:
              entity_id: climate.blutrvbuero
            data:
              temperature: 22
          - service: switch.turn_on
            target:
              entity_id: switch.hm_st15
    default: []  # Keine Default-Aktion
mode: single
